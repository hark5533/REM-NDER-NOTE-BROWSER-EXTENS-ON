<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      height: 440px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    h3 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: #0f172a;
    }

    .search-box {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      background: #ffffff;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-text {
      font-weight: 500;
      color: #334155;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-note {
      color: #2563eb;
      background: #eff6ff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 10px;
      color: #94a3b8;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: 500;
      padding: 0;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      margin-top: 60px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h3>Kayıtlı Notlar & İşaretlemeler</h3>
  <div class="search-box">
    <input type="text" id="search" placeholder="İşaretlemelerde ara...">
  </div>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
